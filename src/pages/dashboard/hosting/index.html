<script>
    (() => {
        const interval = setInterval(() => {
            const valMemoryUsage = Math.floor(Math.random() * 100)
            const valCpuUsage = Math.floor(Math.random() * 100)
            
            Metro.getPlugin("#memory-usage", "donut").val(valMemoryUsage)
            Metro.getPlugin("#cpu-usage", "donut").val(valCpuUsage)
            
            let colorCpu = 'donut-red', colorRam = 'donut-red'
            
            if (valCpuUsage <= 50) {
                colorCpu = 'donut-green'
            } else if (valCpuUsage > 50 && valCpuUsage <= 75) {
                colorCpu = 'donut-orange'
            }
            
            if (valMemoryUsage <= 50) {
                colorRam = 'donut-green'
            } else if (valMemoryUsage > 50 && valMemoryUsage <= 75) {
                colorRam = 'donut-orange'
            }

            $("#cpu-usage").removeClassBy("donut-").addClass(colorCpu)
            $("#memory-usage").removeClassBy("donut-").addClass(colorRam)
            
            $("#cpu-value").html(valCpuUsage + '%')
            $("#ram-value").html(valMemoryUsage + '%')
        }, 2000)
        
        App.intervals.push(interval)
    })();
</script>
