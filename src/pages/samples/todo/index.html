<script>window.PAGE_TITLE = 'ToDo App'</script>

<div class="h-100" style="background: var(--default-background);">
    <div class="text-center h1 m-4">ToDo App</div>
    <hr class="thin"/>
    <div class="d-flex gap-1 flex-justify-center p-4">
        <input id="task" type="text" data-role="input" placeholder="Enter task..." />
        <button class="primary button-add"><span class="mif-plus"></span> ADD TASK</button>
        <button class="button-reload" title="Reload Tasks (Alt+R)" data-hotkey="alt+r"><span class="mif-refresh"></span></button>
        <button class="button-print" title="Print Tasks (Alt+P)" data-hotkey="alt+p"><span class="mif-print"></span></button>
        <button class="button-clear alert" title="Clear Tasks (Alt+D)" data-hotkey="alt+d"><span class="mif-clear-all"></span></button>
    </div>
    
    <div class="p-4">
        <table class="table striped border bd-default">
            <thead>
            <tr>
                <th style="width: 30px"></th>
                <th style="width: 200px">Date</th>
                <th>Task</th>
                <th style="width: 100px">Status</th>
                <th style="width: 120px">Actions</th>
            </tr>
            </thead>
            <tbody id="tasks"></tbody>
        </table>
    </div>
</div>

<script>
    const taskInput = $('#task');
    
    function loadTasks(){
        const tasks = Metro.storage.getItem('panda:tasks', []);
        const taskList = $('#tasks');
        taskList.empty();
        tasks.forEach(task => {
            const state = task.done === -1 
                ? '<svg width="16" height="16" aria-label="failed" viewBox="0 0 16 16" role="img" xmlns="http://www.w3.org/2000/svg"><path fill="#e5534b" d="M2.343 13.657A8 8 0 1 1 13.658 2.343 8 8 0 0 1 2.343 13.657ZM6.03 4.97a.751.751 0 0 0-1.042.018.751.751 0 0 0-.018 1.042L6.94 8 4.97 9.97a.749.749 0 0 0 .326 1.275.749.749 0 0 0 .734-.215L8 9.06l1.97 1.97a.749.749 0 0 0 1.275-.326.749.749 0 0 0-.215-.734L9.06 8l1.97-1.97a.749.749 0 0 0-.326-1.275.749.749 0 0 0-.734.215L8 6.94Z"></path></svg>'
                : task.done === 0 
                    ? '<svg width="16" height="16" aria-label="currently running" fill="none" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" class="ani-spin"><path fill="none" stroke="#DBAB0A" stroke-width="2" d="M3.05 3.05a7 7 0 1 1 9.9 9.9 7 7 0 0 1-9.9-9.9Z" opacity=".5"></path><path fill="#DBAB0A" fill-rule="evenodd" d="M8 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z" clip-rule="evenodd"></path><path fill="#DBAB0A" d="M14 8a6 6 0 0 0-6-6V0a8 8 0 0 1 8 8h-2Z"></path></svg>'
                    : '<svg width="16" height="16" aria-label="completed successfully" viewBox="0 0 16 16" role="img" xmlns="http://www.w3.org/2000/svg"><path fill="green" d="M8 16A8 8 0 1 1 8 0a8 8 0 0 1 0 16Zm3.78-9.72a.751.751 0 0 0-.018-1.042.751.751 0 0 0-1.042-.018L6.75 9.19 5.28 7.72a.751.751 0 0 0-1.042.018.751.751 0 0 0-.018 1.042l2 2a.75.75 0 0 0 1.06 0Z"></path></svg>';    
            const status = task.done === -1 
                ? '<span class="badge alert">Wrong</span>'
                : task.done === 0 
                    ? '<span class="badge warning">Pending...</span>'
                    : '<span class="badge success">Done</span>';
            
            const tr = $("<tr>")
            tr.html(`
                <tr>
                    <td>${state}</td>
                    <td>${datetime(+task.id).format("DD/MM/YYYY HH:mm")}</td>
                    <td>${task.name}</td>
                    <td>${status}</td>
                    <td>
                        <button title="Set as complete" class="square small task-done button-soft-green" data-task-id="${task.id}"><span class="mif-checkmark"></span></button>
                        <button title="Set as wrong" class="square small task-wrong button-soft-coral" data-task-id="${task.id}"><span class="mif-clear"></span></button>
                        <button title="Delete task" class="square small task-delete alert" data-task-id="${task.id}"><span class="mif-bin"></span></button>                        
                    </td>
                </tr>
            `).appendTo(taskList);
        });
    }
    
    function addTask(){
        const val = taskInput.val().trim()
        if (val === '') {
            return;
        }
        const task = {
            id: Date.now(),
            name: val,
            done: 0
        }
        const tasks = Metro.storage.getItem('panda:tasks', []);
        tasks.push(task);
        Metro.storage.setItem('panda:tasks', tasks);
        loadTasks();
        taskInput.val('');
    }

    $('.button-print').on('click', printTasks);
    $(".button-add").on("click", addTask)
    $(".button-reload").on("click", loadTasks)
    $(".button-clear").on("click", function (){
        const tasks = Metro.storage.getItem('panda:tasks', []);
        if (tasks.length === 0) {
            return;
        }
        Metro.dialog.create({
            title: "Clear Tasks",
            content: "Are you sure you want to clear all tasks?",
            defaultActions: false,
            customButtons: [
                {
                    text: "Yes",
                    cls: "primary js-dialog-close",
                    onclick: function () {
                        Metro.storage.delItem('panda:tasks');
                        $('#tasks').empty();
                        loadTasks()
                    },
                },
                {
                    text: "No",
                    cls: "js-dialog-close",
                }
            ]
        })
    })
    
    taskInput.on('keyup', function(e){
        if(e.keyCode === 13){
            addTask();
        }
    });
    
    function printTasks(){
        window.print();
    }
    
    $("#tasks").on("click", ".task-delete", function (){
        const taskId = $(this).data("task-id");
        const tasks = Metro.storage.getItem('panda:tasks', []);
        const newTasks = tasks.filter(task => +task.id !== +taskId);
        Metro.storage.setItem('panda:tasks', newTasks);
        loadTasks()
    })
    
    $("#tasks").on("click",".task-done",  function (){
        const taskId = $(this).data("task-id");
        const tasks = Metro.storage.getItem('panda:tasks', []);
        const newTasks = tasks.map(task => {
            if (+task.id === +taskId) {
                task.done = 1;
            }
            return task;
        });
        Metro.storage.setItem('panda:tasks', newTasks);
        loadTasks()
    })
    
    $("#tasks").on("click",".task-wrong",  function (){
        const taskId = $(this).data("task-id");
        const tasks = Metro.storage.getItem('panda:tasks', []);
        const newTasks = tasks.map(task => {
            if (+task.id === +taskId) {
                task.done = -1;
            }
            return task;
        });
        Metro.storage.setItem('panda:tasks', newTasks);
        loadTasks()
    })
    
    loadTasks()
</script>
