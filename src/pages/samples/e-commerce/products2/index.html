<script>window.PAGE_TITLE = 'E-Commerce | Product List'</script>

<div class="row">
    <div class="cell-md-6 d-flex flex-align-items-center">
        <h1>Product List</h1>
    </div>
    <div class="cell-md-6 d-flex flex-justify-content-end-md flex-align-items-center">
        <ul class="breadcrumbs default">
            <li><a href="#">Panda 1.0</a></li>
            <li><a href="#">E-Commerce</a></li>
            <li class="active"><a href="#">Product List</a></li>
        </ul>
    </div>
</div>

<div class="box" style="height: calc(100% - 70px); overflow-y: auto">
    <div class="product-list">
        <div class="d-flex">
            <h2>Products:</h2>
            <div class="ml-auto">
                <div data-role="toggle-button" data-on-change="changeView">
                    <button data-view="full"><span class="mif-microsoft" title="Full size cards"></span></button>
                    <button data-view="compact"><span class="mif-apps" title="Compact cards"></span></button>
                </div>
            </div>
        </div>
        <div data-role="remote-dataset"
             data-key-offset="skip"
             data-key-data="products"
             data-key-limit="limit"
             data-key-total="total"
             data-key-sort="sortBy"
             data-key-order="order"
             data-key-search="q"
             data-url='https://dummyjson.com/products'
             data-url-search='https://dummyjson.com/products/search'
             data-cls-body="d-flex flex-row flex-wrap gap-1 mt-4"
             data-cls-pagination="mt-4 d-flex flex-justify-center"
             data-sort="rating:desc"
             data-sort-rules="price:asc:Price:<span class='mif-arrow-up'>,price:desc:Price:<span class='mif-arrow-down'>,rating:desc:By rating:<span class='mif-star-empty'>"
             data-on-draw-entry="drawEntry"
             data-rows="24"
             data-rows-steps="10, 24, 48, 96, 192"
             data-sort-label="<span class='mif-import-export'>"
        ></div>
    </div>
</div>

<style>
    .product-card {
        width: 33%;
        
        &::before {
            content: '';
            display: none;
            position: absolute;
            top: -1rem;
            left: -1rem;
            right: -1rem;
            bottom: 0;
            border-radius: 0.25rem;
            background-color: var(--product-card-background);
            box-shadow: 0 16px 16px #0000003d;
            z-index: -1;
            border: 1px solid var(--border-color);
        }

        .product-props {
            display: none;
            position: absolute;
            top: calc(100% - 2px);
            left: calc(-1rem + 1px);
            right: calc(-1rem + 1px);
            padding: 1rem;
            background-color: var(--product-card-background);
            z-index: -1;
            box-shadow: 0 16px 16px #0000003d;
            border-bottom-left-radius: 0.25rem;
            border-bottom-right-radius: 0.25rem;
        }

        &:hover {
            z-index: 2;
            &::before {
                display: block;
            }

            .product-props {
                display: block;
            }
        }
    }

    .compact-view {
        .product-card {
            --product-card-font-size: 12px;
            width: calc(25% - 4px);
        }
    }
    
    dl {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-flow: row wrap;
        gap: 0.5rem;
        
        dt, dd {
            width: 50%;
        }
    }
</style>

<script>
    function changeView() {
        $(".product-list").toggleClass("compact-view");
    }
    
    function drawEntry(entry, index, body) {
        const statuses = [
            "<div class='fg-green product-status'>Ready to depart <span class=\"mif-truck-delivery icon\"></span></div>",
            "<div class='fg-blue product-status'>In stock <span class=\"mif-transport icon\"></span></div>",
            "<div class='fg-coral product-status'>Waiting for stock <span class=\"mif-truck2 icon\"></span></div>",
            "<div class='fg-red product-status'>Out of stock</div>",
        ]
        
        const status = statuses[Math.floor(Math.random() * statuses.length)];
        
        const card = `
            <div class="product-card h-100">
                ${entry.brand ? "<div class=\"badge badge-blue\">"+entry.brand+"</div>" : ""}
                <div class="product-image">
                    <img src="${entry.thumbnail}" alt="${entry.title}"/>                
                </div>            
                <div class="product-info">
                    <a href="#" class="product-title fg-sat-green-hover">
                        ${entry.description}
                    </a>
                    <div class="product-rating" style="--rating-on-color: #ffa500;">
                        <input data-role="rating" data-static="true" data-value="${entry.rating}" />
                        <div class="d-flex flex-align-center mt-1 gap-1"><span class="mif-chat-line"></span> ${entry.reviews.length}</div>
                    </div>            
                    ${status}
                </div>
                <div class="product-footer mt-auto">
                    <div class="product-price">
                        ${entry.discountPercentage ? "<div class='-old'>$"+(entry.price)+"</div>" : ""}
                        <div class="fg-red">$${(entry.price - entry.price/100*entry.discountPercentage).toFixed(2)}</div>
                    </div>
                    <div class="ml-auto">
                        <button class="square large flat"><span class="mif-favorite-outline enlarge-6 fg-orange"></span></button>
                        <button class="square large flat"><span class="mif-add-shopping-cart enlarge-6 fg-green"></span></button>
                    </div>
                </div>
                <div class="product-props border-top bd-default pt-4">
                    <div class="product-desc">${entry.description}</div>
                </div>
            </div>        
        `;

        $(body).append(card);
    }
</script>
