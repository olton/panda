<script>window.PAGE_TITLE = 'E-Commerce | Product List'</script>

<div class="row">
    <div class="cell-md-6 d-flex flex-align-items-center">
        <h1>Product List</h1>
    </div>
    <div class="cell-md-6 d-flex flex-justify-content-end-md flex-align-items-center">
        <ul class="breadcrumbs default">
            <li><a href="#">Panda 1.0</a></li>
            <li><a href="#">E-Commerce</a></li>
            <li class="active"><a href="#">Product List</a></li>
        </ul>
    </div>
</div>

<div class="box" style="height: calc(100% - 70px); overflow-y: auto">
    <div class="product-list">
        <div class="d-flex">
            <h2>Products:</h2>
            <div class="ml-auto">
                <div data-role="toggle-button" data-on-change="changeView">
                    <button data-view="block"><span class="mif-microsoft"></span></button>
                    <button data-view="row"><span class="mif-list"></span></button>
                </div>
            </div>
        </div>
        <div data-role="remote-dataset"
             data-key-offset="skip"
             data-key-data="products"
             data-key-limit="limit"
             data-key-total="total"
             data-key-sort="sortBy"
             data-key-order="order"
             data-key-search="q"
             data-url='https://dummyjson.com/products'
             data-url-search='https://dummyjson.com/products/search'
             data-cls-body="row gap-4 mt-4"
             data-cls-pagination="mt-4 d-flex flex-justify-center"
             data-sort="rating:desc"
             data-sort-rules="price:asc:Price:<span class='mif-arrow-up'>,price:desc:Price:<span class='mif-arrow-down'>,rating:desc:By rating:<span class='mif-star-empty'>"
             data-on-draw-entry="drawEntry"
             data-rows="6"
             data-rows-steps="6, 24, 48, 96, 192"
             data-sort-label="<span class='mif-import-export'>"
        ></div>
    </div>
</div>

<style>
    .card {
        position: relative;
        display: flex;
        flex-flow: column;
        padding: 1rem;
        height: 100%;
    }
    
    .product-image {
        height: 200px;
        display: flex;
        justify-content: center;
        img {
            object-fit: cover;
            height: 100%;
            /*mix-blend-mode: darken;*/
        }
    }

    .product-title {
        font-size: 18px;
        font-weight: 500;
        line-height: 1.1;
        margin: 1rem 0;
    }

    .product-desc {
        font-size: 12px;
        font-weight: 400;
        margin-bottom: 1rem;
    }

    .product-price {
        font-size: 18px;
        font-weight: 500;
    }

    .product-brand {
        font-size: 10px;
        font-weight: 500;
        top: 10px;
        left: 10px;
        padding: 4px 8px;
        border-radius: 2px;
        display: inline-flex;
        color: #0a0a0a;
    }

    .product-qrcode {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 64px;
        height: 64px;
    }
    
    .view-row {
        flex-flow: row nowrap;
        
        .product-data {
            margin-right: 2rem;
        }
        
        .product-rating, .product-tags {
            display: none;
        }
        
        .product-image {
            width: 120px;
            height: 120px;
            aspect-ratio: 1;
            margin-right: 1rem;

            img {
                object-fit: cover;
            }
        }
        
        .actions {
            margin-left: auto;
        }
    }
</style>

<script>
    var viewMode = "block";
    
    function changeView(btn) {
        const view = $(btn).data("view");
        viewMode = view;
        if (view === "row") {
            $(".card").addClass("view-row").parent().removeClassBy("cell-").addClass("cell-fs-12")
        } else {
            $(".card").removeClass("view-row").parent().removeClassBy("cell-").addClass("cell-ld-6 cell-md-4")       
        }
    }
    
    function drawEntry(entry, index, body) {
        const productCard =  entry ? `
        <div class="${viewMode === "row" ? "cell-fs-12" : "cell-ld-6 cell-md-4"}">
            <div class="card ${viewMode === "row" ? "view-row" : ""}">
                <div class="product-image"><img src="${entry.thumbnail}" alt="${entry.title}"/></div>
                <div class="product-data">
                    <div class="product-title">${entry.title}</div>
                    <div class="product-rating mb-4">
                        <input data-role="rating" data-static="true" data-value="${entry.rating}" data-stared-color="#f2c313" data-message="(${entry.rating})"/>
                    </div>
                    <div class="product-tags">
                        <span class="product-brand bg-sand">${entry.brand ? entry.brand : 'Noname'}</span>
                        ${entry.tags.map(sel => `<span class="mr-1 product-brand bg-light-sand">${sel}</span>`).join('')}
                    </div>
                    <div><span class="product-desc">${entry.description}</span></div>
                    <div class="row mt-auto">
                        <div class="cell-4">
                            <div class="product-price"><span class="">$${entry.price}</span></div>
                        </div>
                        <div class="cell-8">
                        </div>
                    </div>                
                </div>
                <div class="d-flex flex-row gap-2 mt-4 actions">
                    <button class="button success"><span data-role="eval">{{ Metro.locale.label_buy}}</span> <span class="mif-add-shopping-cart icon"></span></button>
               
                    <button class="ml-auto button square outline fg-orange"><span class="mif-star-empty"></span></button>
                    <button class="button info"><span data-role="eval">{{ Metro.locale.label_details}}</span></button>
                </div>
            </div>   
        </div>   
        ` : ``;

        $(body).append(productCard);
    }

    function drawPriceHint(value) {
        return "$"+(+value).format(0, 3, " ");
    }
</script>
